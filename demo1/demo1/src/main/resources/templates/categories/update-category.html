<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Update Category</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>
    <section layout:fragment="content" class="container mt-5">
        <h1 class="mb-4">Update Category</h1>
        <form th:action="@{/categories/update/{id}(id=${category.id})}" th:object="${category}" method="post"
            class="needs-validation" novalidate>
            <div class="mb-3">
                <label for="name" class="form-label">Category Name:</label>
                <input type="text" th:field="*{name}" class="form-control" id="name" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Valid name is
                    required.</div>
            </div>

            <div class="mb-3">
                <label for="groupName" class="form-label">Group (Nhóm danh mục):</label>
                <input type="text" th:field="*{groupName}" class="form-control" id="groupName">
            </div>

            <div class="mb-3">
                <label for="imageUrl" class="form-label">Category Image URL (Hình ảnh):</label>
                <input type="text" th:field="*{imageUrl}" class="form-control" id="imageUrl">
            </div>
            <button type="submit" class="btn btn-primary">Update</button>
            <a th:href="@{/categories}" class="btn btn-link">Cancel</a>
        </form>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>
</body>

</html>
