<section layout:fragment="content" class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4 p-3 bg-light border-start border-4 border-warning shadow-sm">
        <h2 class="fw-bold mb-0" style="color: #333;">DANH SÁCH SẢN PHẨM</h2>
        <a th:href="@{/products/add}" class="btn btn-warning fw-bold shadow-sm">
            <i class="bi bi-plus-circle"></i> + THÊM MỚI SẢN PHẨM
        </a>
    </div>

    <div class="card shadow border-0">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead style="background-color: #333; color: white;">
                <tr class="text-center align-middle">
                    <th class="py-3">ID</th>
                    <th>Tên sản phẩm</th>
                    <th>Giá bán</th>
                    <th>Danh mục</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="product : ${products}" class="align-middle text-center border-bottom">
                    <td th:text="${product.id}" class="text-muted"></td>
                    <td class="text-start px-4">
                        <span th:text="${product.name}" class="fw-bold text-dark d-block"></span>
                        <small class="text-muted" th:text="${product.description}"></small>
                    </td>
                    <td>
                            <span th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'"
                                  class="text-danger fw-bold fs-5"></span>
                    </td>
                    <td>
                        <span class="badge bg-secondary px-3 py-2" th:text="${product.category.name}"></span>
                    </td>
                    <td class="py-3">
                        <div class="btn-group">
                            <a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn btn-outline-success btn-sm px-3">Sửa</a>
                            <a th:href="@{/products/delete/{id}(id=${product.id})}"
                               class="btn btn-outline-danger btn-sm px-3"
                               onclick="return confirm('Xác nhận xóa sản phẩm này?')">Xóa</a>
                        </div>
                    </td>
                </tr>
                <tr th:if="${products.isEmpty()}">
                    <td colspan="5" class="text-center py-5 text-muted">
                        <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                        Chưa có sản phẩm nào trong hệ thống.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
